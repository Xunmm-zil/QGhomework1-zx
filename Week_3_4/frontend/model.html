    <!-- 背景遮罩层 -->

    <!-- 模型权重表单 -->
    <form id="moform" class="moform">
        <div class="moname">OpenAI</div>
        <div>weigth:<br>
            <input type="text" id="weight">
        </div>
        <div>qustion:<br>
            <input type="text" id="question">
        </div>
        <button id="cancel-button">取消</button>
        <button id="confirm-button">确认</button>
    </form>
    <!-- 上传模型表单 -->
    <form id="upmoform" class="upmoform">
        <div class="uptl">上传模型</div>
        <div>modelName:<br>
            <input type="text" id="modelName">
        </div>
        <div>modelUrl:<br>
            <input type="text" id="modelUrl">
        </div>
        <div>简介:<br>
            <textarea name="introduce" id=""></textarea>
        </div>
        <button id="cancel-button">取消</button>
        <button id="confirm-button">确认</button>
    </form>
    <!-- 运行项目菜单 -->
    <form id="run" class="run">
        <div>项目名称:<br>
            <input type="text" id="itemname" class="itemname">
        </div>
        <div>请输入您的需求:<br>
            <textarea name="content" id="content"></textarea>
        </div>
        <div class="imgcontain">上传图片:<br>
            <label for="image" class="image">
                <input type="file" id="image" style="display: none;">
                <div class="puls" id="puls">+</div>
            </label>
        </div>
        <button id="cancel-button">取消</button>
        <button id="confirm-button">运行</button>
    </form>
